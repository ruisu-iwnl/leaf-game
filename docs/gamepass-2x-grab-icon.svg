<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="coin" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="55%" stop-color="#ffcd3c"/>
      <stop offset="100%" stop-color="#e0a415"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="#3a2214"/>

  <!-- coin badge -->
  <circle cx="256" cy="256" r="200" fill="url(#coin)" stroke="#ffeed2" stroke-width="14"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#c8850f" stroke-width="6" opacity="0.55"/>

  <!-- 2X text -->
  <text x="256" y="300" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="176" fill="#3a2214" text-anchor="middle">2X</text>

  <!-- small leaf accents, top-left and bottom-right, matching the game's autumn theme -->
  <g transform="translate(120,120) rotate(-20)">
    <path d="M0 0 C 30 -10, 55 10, 60 45 C 25 45, -5 30, 0 0 Z" fill="#c1502a"/>
  </g>
  <g transform="translate(392,392) rotate(160)">
    <path d="M0 0 C 30 -10, 55 10, 60 45 C 25 45, -5 30, 0 0 Z" fill="#c1502a"/>
  </g>
</svg>
