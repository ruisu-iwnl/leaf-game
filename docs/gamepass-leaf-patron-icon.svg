<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="coin" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#d9b8f5"/>
      <stop offset="55%" stop-color="#7a3cc4"/>
      <stop offset="100%" stop-color="#3f1d6b"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="#3a2214"/>

  <!-- coin badge -->
  <circle cx="256" cy="256" r="200" fill="url(#coin)" stroke="#ffeed2" stroke-width="14"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#5a2a99" stroke-width="6" opacity="0.55"/>

  <!-- crown glyph: gold band + 3 spikes (center tallest), same silhouette as the LeafPatronOwner
       badge and PerkIcons.luau's in-game icon, so the Pass/Badge/Inventory icon all read as one -->
  <rect x="196" y="296" width="120" height="30" rx="6" fill="#ffeed2"/>
  <polygon points="176,296 336,296 316,196 256,248 196,196" fill="#ffeed2"/>
  <circle cx="196" cy="196" r="15" fill="#d4af37"/>
  <circle cx="256" cy="182" r="17" fill="#d4af37"/>
  <circle cx="316" cy="196" r="15" fill="#d4af37"/>

  <!-- small clover-green leaf accents, top-left and bottom-right, same shape every other icon in
       this game reuses (badges, the other Passes), recolored gold for the VIP/premium theme -->
  <g transform="translate(120,120) rotate(-20)">
    <path d="M0 0 C 30 -10, 55 10, 60 45 C 25 45, -5 30, 0 0 Z" fill="#d4af37"/>
  </g>
  <g transform="translate(392,392) rotate(160)">
    <path d="M0 0 C 30 -10, 55 10, 60 45 C 25 45, -5 30, 0 0 Z" fill="#d4af37"/>
  </g>
</svg>
