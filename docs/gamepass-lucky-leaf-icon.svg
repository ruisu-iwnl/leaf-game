<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="coin" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#c9f5d6"/>
      <stop offset="55%" stop-color="#4caf6e"/>
      <stop offset="100%" stop-color="#276b41"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="#3a2214"/>

  <!-- coin badge -->
  <circle cx="256" cy="256" r="200" fill="url(#coin)" stroke="#ffeed2" stroke-width="14"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#1f6e39" stroke-width="6" opacity="0.55"/>

  <!-- leprechaun hat glyph -->
  <ellipse cx="256" cy="336" rx="96" ry="17" fill="#1c5c33"/>
  <path d="M208 332 C 208 332, 218 192, 256 166 C 294 192, 304 332, 304 332 Z" fill="#2e9e52"/>
  <rect x="205" y="300" width="102" height="21" rx="5" fill="#1a1a1a"/>
  <rect x="241" y="297" width="30" height="27" rx="3" fill="#ffcd3c" stroke="#2a1810" stroke-width="3"/>

  <!-- small clover-green leaf accents, top-left and bottom-right, same shape every other icon in
       this game reuses (badges, the 2X Grab pass), recolored to fit the luck/clover theme -->
  <g transform="translate(120,120) rotate(-20)">
    <path d="M0 0 C 30 -10, 55 10, 60 45 C 25 45, -5 30, 0 0 Z" fill="#2e9e52"/>
  </g>
  <g transform="translate(392,392) rotate(160)">
    <path d="M0 0 C 30 -10, 55 10, 60 45 C 25 45, -5 30, 0 0 Z" fill="#2e9e52"/>
  </g>
</svg>
